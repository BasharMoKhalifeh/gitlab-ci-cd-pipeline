stages:
  - build
  - push
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  IMAGE: "$REGISTRY_URL/$IMAGE_NAME:$IMAGE_TAG"

build:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  script:
    - docker info
    - docker build -t "$IMAGE" .
    - docker save "$IMAGE" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

push:
  stage: push
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  needs:
    - job: build
      artifacts: true
  script:
    - docker info
    - docker load -i image.tar
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
    - docker push "$IMAGE"
    - docker tag "$IMAGE" "$REGISTRY_URL/$IMAGE_NAME:latest"
    - docker push "$REGISTRY_URL/$IMAGE_NAME:latest"

# Deployment is manual by default so the public repository can be cloned
# without exposing deployment credentials. Configure the variables described
# in README.md before triggering this job.
deploy:
  stage: deploy
  image: alpine:3.21
  when: manual
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login '$REGISTRY_URL' -u '$REGISTRY_USER' --password-stdin" <<< "$REGISTRY_PASSWORD"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker pull '$IMAGE'"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker rm -f docker-pipeline-lab || true"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker run -d --name docker-pipeline-lab -p 8080:8080 '$IMAGE'"
